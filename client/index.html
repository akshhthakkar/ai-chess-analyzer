<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Chess Analyzer</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>♟️ AI Chess Analyzer</h1>
        <span id="server-status" class="status-offline"
          >Server: Checking...</span
        >
      </header>

      <main>
        <p>Analyze your chess moves with AI!</p>

        <div class="input-group">
          <input
            type="text"
            id="move-input"
            placeholder="Enter chess move (e.g. e2e4)"
          />
          <button id="analyze-btn">Analyze Move</button>
        </div>

        <div id="history-section" class="hidden">
          <h3>Move History</h3>
          <ul id="move-history"></ul>
        </div>

        <div id="result-section" class="hidden">
          <strong>Result:</strong> <span id="analysis-result"></span>
        </div>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
