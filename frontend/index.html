<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Chess Analyzer</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Chessboard.js CSS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="logo">
          <span class="logo-icon">♟</span>
          <span class="logo-text">Chess Analyzer</span>
        </div>

        <nav class="nav">
          <a href="#" class="nav-item active">
            <svg
              width="20"
              height="20"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"
              />
            </svg>
            Analyze
          </a>
        </nav>

        <div class="sidebar-footer">
          <div class="server-badge" id="server-badge">
            <span class="status-dot"></span>
            <span id="server-status">Connecting...</span>
          </div>
        </div>
      </aside>

      <!-- Main Content -->
      <main class="main">
        <!-- Header -->
        <header class="header">
          <h1>Position Analysis</h1>
          <p class="subtitle">Analyze chess positions with Stockfish engine</p>
        </header>

        <!-- Content Grid -->
        <div class="content-grid">
          <!-- Board Section -->
          <section class="board-section">
            <div class="card">
              <div class="card-header">
                <h2>Board</h2>
                <div class="turn-badge" id="turn-badge">
                  <span class="turn-dot"></span>
                  <span id="turn-display">White to move</span>
                </div>
              </div>

              <div id="board" class="chessboard"></div>

              <div class="board-controls">
                <button id="btn-start" class="btn btn-icon" title="Reset">
                  <svg
                    width="18"
                    height="18"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"
                    />
                  </svg>
                </button>
                <button id="btn-clear" class="btn btn-icon" title="Clear">
                  <svg
                    width="18"
                    height="18"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"
                    />
                  </svg>
                </button>
                <button id="btn-flip" class="btn btn-icon" title="Flip">
                  <svg
                    width="18"
                    height="18"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"
                    />
                  </svg>
                </button>
              </div>

              <div class="fen-input-group">
                <input
                  type="text"
                  id="fen-input"
                  class="input"
                  placeholder="Paste FEN notation..."
                  value="rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1"
                />
                <button id="btn-load-fen" class="btn btn-primary">Load</button>
              </div>
            </div>
          </section>

          <!-- Analysis Section -->
          <section class="analysis-section">
            <div class="card">
              <div class="card-header">
                <h2>Settings</h2>
              </div>

              <div class="settings-group">
                <div class="setting-item">
                  <label>Depth</label>
                  <div class="slider-group">
                    <input
                      type="range"
                      id="depth-slider"
                      class="slider"
                      min="10"
                      max="30"
                      value="20"
                    />
                    <span id="depth-value" class="slider-value">20</span>
                  </div>
                </div>

                <div class="setting-item">
                  <label>Lines</label>
                  <div class="slider-group">
                    <input
                      type="range"
                      id="lines-slider"
                      class="slider"
                      min="1"
                      max="5"
                      value="3"
                    />
                    <span id="lines-value" class="slider-value">3</span>
                  </div>
                </div>
              </div>

              <button id="btn-analyze" class="btn btn-primary btn-full">
                <svg
                  width="18"
                  height="18"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
                  />
                </svg>
                Analyze Position
              </button>
            </div>

            <!-- Evaluation Card -->
            <div class="card">
              <div class="card-header">
                <h2>Evaluation</h2>
                <span id="eval-text" class="eval-score">0.00</span>
              </div>

              <div class="eval-bar-container">
                <div class="eval-bar-bg">
                  <div id="eval-bar" class="eval-bar"></div>
                </div>
                <div class="eval-labels">
                  <span>Black</span>
                  <span>White</span>
                </div>
              </div>
            </div>

            <!-- Results Card -->
            <div class="card" id="results-card">
              <div class="card-header">
                <h2>Best Lines</h2>
              </div>

              <div id="loading" class="loading hidden">
                <div class="spinner"></div>
                <span>Analyzing...</span>
              </div>

              <div id="analysis-lines" class="analysis-lines"></div>

              <div id="error-display" class="error-display hidden"></div>
            </div>
          </section>
        </div>
      </main>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
