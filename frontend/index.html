<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chess Analyzer Pro</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <!-- Navigation -->
      <nav class="nav">
        <div class="nav-brand">
          <div class="brand-icon">♛</div>
          <span class="brand-text"
            >ChessAnalyzer<span class="brand-pro">PRO</span></span
          >
        </div>
        <div class="nav-status">
          <div class="status-indicator" id="server-badge">
            <div class="status-pulse"></div>
            <span id="server-status">Connecting</span>
          </div>
        </div>
      </nav>

      <!-- Main Content -->
      <main class="main">
        <div class="workspace">
          <!-- Left: Board + Controls -->
          <section class="board-section">
            <div class="board-container">
              <div id="board"></div>
            </div>

            <!-- Move Navigation -->
            <div class="move-nav">
              <button id="btn-start" class="nav-btn" title="Start">⏮</button>
              <button id="btn-prev" class="nav-btn" title="Previous">◀</button>
              <button id="btn-next" class="nav-btn" title="Next">▶</button>
              <button id="btn-end" class="nav-btn" title="End">⏭</button>
              <button id="btn-flip" class="nav-btn" title="Flip">↕</button>
            </div>

            <!-- Evaluation Bar -->
            <div class="eval-container">
              <div class="eval-bar-wrapper">
                <div class="eval-bar" id="eval-bar"></div>
              </div>
              <span class="eval-score" id="eval-text">0.00</span>
            </div>
          </section>

          <!-- Right: Analysis Panel -->
          <section class="analysis-section">
            <!-- Tab Navigation -->
            <div class="tab-nav">
              <button class="tab-btn active" data-tab="moves">Moves</button>
              <button class="tab-btn" data-tab="analysis">Engine</button>
              <button class="tab-btn" data-tab="report">Report</button>
            </div>

            <!-- Moves Tab -->
            <div class="tab-content active" id="tab-moves">
              <div class="pgn-input-section">
                <textarea
                  id="pgn-input"
                  class="pgn-input"
                  placeholder="Paste PGN or moves here...
Example: 1. e4 e5 2. Nf3 Nc6 3. Bb5"
                ></textarea>
                <div class="pgn-actions">
                  <button id="btn-load-pgn" class="btn-primary">
                    Load Game
                  </button>
                  <button id="btn-analyze-game" class="btn-accent">
                    Analyze Game
                  </button>
                </div>
              </div>

              <div class="move-list-container">
                <div id="move-list" class="move-list"></div>
              </div>

              <!-- Move Explanation Panel -->
              <div id="explanation-panel" class="explanation-panel hidden">
                <div class="explanation-header">
                  <div class="header-left">
                    <span class="explanation-move" id="exp-move-name">e4</span>
                    <span class="explanation-badge" id="exp-classification"
                      >Best</span
                    >
                  </div>
                  <button id="btn-close-panel" class="close-btn" title="Close">
                    ×
                  </button>
                </div>
                <div class="explanation-section">
                  <h4>Your Move</h4>
                  <p id="exp-description">Description of your move...</p>
                  <p class="explanation-impact" id="exp-impact">
                    Impact of your move...
                  </p>
                </div>
                <div
                  class="explanation-section best-move-section"
                  id="exp-best-section"
                >
                  <h4>Better Move: <span id="exp-best-move">Nf3</span></h4>
                  <p id="exp-best-description">Description of best move...</p>
                  <p class="explanation-impact" id="exp-best-impact">
                    Impact...
                  </p>
                </div>
                <p class="explanation-reason" id="exp-reason">
                  Classification reason
                </p>
              </div>
            </div>

            <!-- Engine Tab -->
            <div class="tab-content" id="tab-analysis">
              <div class="engine-header">
                <span class="engine-label">Stockfish 16</span>
                <span class="depth-label"
                  >Depth: <span id="depth-display">20</span></span
                >
              </div>

              <div class="engine-settings">
                <div class="setting-row">
                  <label for="depth-slider">Depth</label>
                  <input
                    type="range"
                    id="depth-slider"
                    min="10"
                    max="30"
                    value="20"
                  />
                  <span id="depth-value">20</span>
                </div>
                <div class="setting-row">
                  <label for="lines-slider">Lines</label>
                  <input
                    type="range"
                    id="lines-slider"
                    min="1"
                    max="5"
                    value="3"
                  />
                  <span id="lines-value">3</span>
                </div>
              </div>

              <button id="btn-analyze" class="btn-accent full-width">
                ▶ Analyze Position
              </button>

              <div id="loading" class="loading hidden">
                <div class="spinner"></div>
                <span>Analyzing...</span>
              </div>

              <div id="analysis-lines" class="analysis-lines"></div>
            </div>

            <!-- Report Tab -->
            <div class="tab-content" id="tab-report">
              <div id="report-content" class="report-content">
                <div class="report-placeholder">
                  Load and analyze a game to see the accuracy report
                </div>
              </div>
            </div>

            <!-- Error Display -->
            <div id="error-display" class="error-msg hidden"></div>
          </section>
        </div>
      </main>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
